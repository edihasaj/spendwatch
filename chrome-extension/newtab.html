<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>New Tab</title>
    <link rel="icon" href="chrome-new-tab.svg">
    <link rel="stylesheet" href="newtab.css">
  </head>
  <body data-state="loading">
    <main>
      <nav id="bookmark-bar" aria-label="Tab groups and bookmarks" hidden>
        <div id="tab-groups" aria-label="Open tab groups"></div>
        <details id="tab-group-overflow" class="bar-menu" hidden>
          <summary aria-label="More tab groups"></summary>
          <div id="tab-group-menu" class="bookmark-menu tab-group-menu"></div>
        </details>
        <span class="bar-divider" aria-hidden="true"></span>
        <div id="bookmark-items" aria-label="Bookmarks"></div>
        <details id="bookmark-overflow" class="bar-menu" hidden>
          <summary title="More bookmarks" aria-label="More bookmarks">»</summary>
          <div id="bookmark-overflow-menu" class="bookmark-menu bookmark-overflow-menu"></div>
        </details>
        <span class="bar-divider" aria-hidden="true"></span>
        <button id="all-bookmarks" class="bar-fixed" type="button" title="All Bookmarks">
          <svg class="folder-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M1.75 3.5h4.5l1.5 1.75h6.5v7.25H1.75z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"></path>
          </svg>
          <span>All Bookmarks</span>
        </button>
      </nav>
      <iframe
        id="dashboard"
        title="Spendwatch capacity dashboard"
        referrerpolicy="no-referrer"
        allow="clipboard-write"
      ></iframe>

      <section class="status" aria-live="polite">
        <div class="mark" aria-hidden="true"><span></span></div>
        <p class="eyebrow">Private capacity monitor</p>
        <h1>Spendwatch</h1>
        <p id="message" class="message">Connecting to your metrics</p>
        <div class="pulse" aria-hidden="true"><span></span></div>
        <p id="host" class="host">Dashboard URL not configured</p>
        <form id="configure" hidden>
          <label for="dashboard-url">Dashboard URL</label>
          <div class="url-field">
            <input id="dashboard-url" type="url" inputmode="url" placeholder="https://spendwatch.example.com/" autocomplete="url" required>
            <button type="submit">Connect</button>
          </div>
        </form>
        <div class="status-actions">
          <button id="retry" type="button">Try again</button>
          <button id="settings" type="button">Settings</button>
        </div>
      </section>
    </main>

    <script type="module" src="newtab.js"></script>
  </body>
</html>
