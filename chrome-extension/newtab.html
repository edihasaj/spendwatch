<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>New Tab</title>
    <link rel="icon" href="chrome-new-tab.svg">
    <link rel="stylesheet" href="newtab.css">
  </head>
  <body data-state="loading">
    <main>
      <nav id="bookmark-bar" aria-label="Bookmarks" hidden></nav>
      <iframe
        id="dashboard"
        title="Spendwatch capacity dashboard"
        referrerpolicy="no-referrer"
        allow="clipboard-write"
      ></iframe>

      <section class="status" aria-live="polite">
        <div class="mark" aria-hidden="true"><span></span></div>
        <p class="eyebrow">Private capacity monitor</p>
        <h1>Spendwatch</h1>
        <p id="message" class="message">Connecting to your metrics</p>
        <div class="pulse" aria-hidden="true"><span></span></div>
        <p id="host" class="host">Dashboard URL not configured</p>
        <form id="configure" hidden>
          <label for="dashboard-url">Dashboard URL</label>
          <div class="url-field">
            <input id="dashboard-url" type="url" inputmode="url" placeholder="https://spendwatch.example.com/" autocomplete="url" required>
            <button type="submit">Connect</button>
          </div>
        </form>
        <div class="status-actions">
          <button id="retry" type="button">Try again</button>
          <button id="settings" type="button">Settings</button>
        </div>
      </section>
    </main>

    <script type="module" src="newtab.js"></script>
  </body>
</html>
